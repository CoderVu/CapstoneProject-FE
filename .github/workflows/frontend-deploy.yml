name: Build and Deploy Frontend Docker to Azure VM
on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: vunguyen2901
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate Docker tag
        id: docker_tag
        run: |
          # Use current timestamp + commit SHA for truly unique tag
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          echo "tag=${TIMESTAMP}-${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "short_tag=${TIMESTAMP}-$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Build and push Frontend Docker image
        run: |
          # Clear Docker build cache first
          docker builder prune -f
          
          # Build with unique tag and latest tag (force rebuild)
          docker build --no-cache --pull \
            --build-arg CACHEBUST=$(date +%s) \
            -t vunguyen2901/capstone-frontend:${{ steps.docker_tag.outputs.short_tag }} \
            -t vunguyen2901/capstone-frontend:latest .
          
          # Push both tags
          docker push vunguyen2901/capstone-frontend:${{ steps.docker_tag.outputs.short_tag }}
          docker push vunguyen2901/capstone-frontend:latest
          
          echo "Built and pushed image: vunguyen2901/capstone-frontend:${{ steps.docker_tag.outputs.short_tag }}"

      - name: Deploy frontend Docker on remote server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 20.3.131.196
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "Starting deployment process..."
            
            # Tạo Docker network dockervu nếu chưa có
            docker network inspect dockervu >/dev/null 2>&1 || docker network create dockervu
            echo "Docker network 'dockervu' checked/created successfully"
            
            # Login to DockerHub
            echo "Logging in to DockerHub..."
            if echo ${{ secrets.DOCKERHUB_TOKEN }} | docker login -u vunguyen2901 --password-stdin; then
              echo "DockerHub login successful"
            else
              echo "ERROR: DockerHub login failed"
              exit 1
            fi
            
            # Stop và remove container frontend cũ
            echo "Stopping old container if exists..."
            docker stop capstone-frontend 2>/dev/null || echo "No container to stop"
            docker rm capstone-frontend 2>/dev/null || echo "No container to remove"

            # Xóa ALL images cũ để force pull mới
            echo "Removing ALL old images..."
            docker rmi $(docker images vunguyen2901/capstone-frontend -q) 2>/dev/null || echo "No old images to remove"
            
            # Clear Docker cache
            docker system prune -f
            
            # Pull image mới với tag cụ thể
            echo "Pulling new image: vunguyen2901/capstone-frontend:${{ steps.docker_tag.outputs.short_tag }}"
            if docker pull vunguyen2901/capstone-frontend:${{ steps.docker_tag.outputs.short_tag }}; then
              echo "✅ Image pulled successfully"
            else
              echo "❌ Failed to pull image"
              exit 1
            fi
            
            # Verify image
            docker images | grep vunguyen2901/capstone-frontend
            
            # Run container mới
            echo "Starting new container..."
            docker run -d --name capstone-frontend \
              --network dockervu \
              -p 3000:80 \
              --restart unless-stopped \
              vunguyen2901/capstone-frontend:${{ steps.docker_tag.outputs.short_tag }}
            
            # Verify container
            if [ "$(docker ps -q -f name=capstone-frontend)" ]; then
              echo "✅ Container started successfully"
              echo "🚀 Deployed version: ${{ steps.docker_tag.outputs.short_tag }}"
              docker ps -f name=capstone-frontend
            else
              echo "❌ Container failed to start"
              docker logs capstone-frontend
              exit 1
            fi
            
            echo "🎉 Frontend deployed successfully!"